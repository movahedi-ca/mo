toolchain: rustc 1.99.1, installed locally via rustup stable (this host had no rustc)
deps: rusqlite 0.32, serde 1, serde_json 1, clap 4, uuid 1 (five runtime deps, Cargo.lock pinned)

deviations:
  - systemd timer unit not created: the 60s inventory snapshot and 30s
    dashboard refresh run inside the daemon. A separate timer unit would
    duplicate that work. Service unit covers the daemon. Noted in the unit file.
  - ARM64 compile check blocked: no aarch64-linux-gnu-gcc on this host.
    `cargo check --target aarch64-unknown-linux-gnu` fails in libsqlite3-sys
    build script (ToolNotFound). Not a code issue. TASK-020 owner to verify
    where a cross compiler exists.
  - TASK-015/016 test deviations (2026-11-06, tester): benchmarks and
    adversarial tests ran on this dev VM, not chromebook-vm, with fake
    fixtures in private mount namespaces (fake BAT0 78%, fake meminfo
    6000 MB + fake cpuinfo 16 cores for multi-lease tests, fake vd
    scripts opening TCP listeners on CDP ports, fake bridge responder).
    Guards set to 0 by env (host MemAvailable 635-760 MB is below the
    1200 MB default guard). No MO code was changed for the tests.
  - TEST-024 deviation: bridge-down requests stay queued, not denied.
    No partial grant. E04 appears in the response.
  - TEST-037 observation: inventory reads the battery sensor directly,
    never through the HostAdapter, so Oracle has_battery=false is not
    consulted by the battery gate.

defects:
  - DEFECT-001 (major): unique index on desktop covers "none", so only
    one cpu-ram lease can be active at a time. Second cpu-ram request
    is denied. Evidence in implementation/test-evidence.md.
  - DEFECT-002 (major): release never stops the desktop. A released vd
    keeps its CDP listener up. Fold then refuses it (E13, CDP responds).
  - DEFECT-003 (major): no bypass detection. A desktop started without
    a lease produces zero audit events (TEST-038 FAIL).
  - DEFECT-004 (minor): failed vd-stop writes no audit row and flags
    nothing (TEST-041 FAIL). Error E04 surfaces, nothing is recorded.
  - DEFECT-005 (minor): systemd unit puts StartLimitBurst and
    StartLimitIntervalSec under [Service]; both are [Unit] keys and
    are ignored. Restart rate limiting is inactive.

observations:
  - Grant takes ~607 ms with the bridge down (3x200 ms retry sleeps)
    and ~9 ms with the bridge up. Target still passes.
  - CLI responses mask real denial reasons (E05/E06/E07) as generic
    queued/E04 while the request row is marked denied.
  - No startup drain: a queued request surviving a crash waits for
    the next request to arrive (TEST-022).
  - No CLI cancel command although queue::cancel exists.
  - No CPU-load admission gate exists; load is only observed.
  - Disk guard measures df "/" free space, not the DB filesystem.

notes:

notes:
  - No deploy done. No remote configured. No push made.
  - Daemon smoke tested live on this host (debug build, /tmp paths):
    request -> granted, status, heartbeat, extend, release, health all JSON OK.
  - Socket round trip test covers request to release over a live Unix socket.

