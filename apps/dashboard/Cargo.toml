[package]
name = "mo-dashboard"
version = "0.1.0"
edition = "2021"
description = "MO Dashboard - standalone fullscreen viewer for the MO resource assistant dashboard"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "mo-dashboard"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
cairo-rs = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
