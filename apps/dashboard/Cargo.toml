[package]
name = "mo-dashboard"
version = "0.1.0"
edition = "2021"
description = "MO Dashboard - standalone fullscreen viewer for the MO resource assistant dashboard"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "mo-dashboard"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2.0", features = ["v2_26"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
